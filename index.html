<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zyron™ - Legal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
    }

    .container {
      width: 100%;
      max-width: 850px;
      padding: 25px;
    }

    .card {
      background: #181b24;
      padding: 45px 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: 42px;
    }

    .subtitle {
      color: #999;
      margin: 12px 0 35px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #8ab4ff;
      color: #0f1117;
      text-decoration: none;
      font-weight: bold;
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    .footer {
      margin-top: 35px;
      color: #777;
      font-size: 13px;
    }

    .developer {
      margin-top: 8px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Zyron™</h1>

      <p class="subtitle">
        Official Legal Information
      </p>

      <div class="buttons">
        <a class="button" href="privacy.html">
          Privacy Policy
        </a>

        <a class="button" href="terms.html">
          Terms of Service
        </a>
      </div>

      <div class="footer">
        © 2026 Zyron™. All rights reserved.
        <div class="developer">
          Developed By - Ashu<br>
          Ashu Applications
        </div>
      </div>

    </div>
  </div>

</body>
</html>
